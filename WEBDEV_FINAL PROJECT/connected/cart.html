<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Step Brew | Your Bag</title><link rel="icon" href="StepBrewLogo.png"><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head><body data-page="cart"><header class="site-header" aria-label="Step Brew site header"></header><p id="load-status" class="load-status" role="status" hidden></p><main class="cart-page panel"><h1>Your Bag</h1><p>Your bag is shared across Home, Menu, About, and your account.</p><button class="orange-button" data-action="open-bag">View your bag</button><a class="outline-button" href="Menu.html">Continue shopping</a></main><footer class="site-footer" aria-label="Step Brew footer"></footer><aside id="shopping-bag" class="shopping-bag" aria-label="Your Bag" hidden><h2>Your Bag</h2><ul id="bag-items"></ul><p id="bag-message" role="status"></p><div class="bag-total"><span>Total Price:</span><strong id="bag-total">₱ 0.00</strong></div><div class="bag-actions"><button id="place-order">Place Order</button><button data-action="close-bag">CLOSE</button></div></aside><dialog id="editor-dialog" class="editor-dialog"><button class="dialog-close" data-action="close-dialog" aria-label="Close dialog">×</button><div id="editor-content"></div></dialog><dialog id="order-dialog" class="order-dialog"><h2>Brewing!</h2><div class="clock-icon" aria-hidden="true">◷</div><p>Your order is in progress.</p><p id="order-reference" class="small"></p><button data-action="close-order">OK</button></dialog><p id="toast" class="toast" role="status" hidden></p></body></html>
