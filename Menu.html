<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Brew</title>
    <link rel="icon" href="StepBrewLogo.png">
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="menu-background">
    <div class="container">
        <div class="main_header">
            <div class="logo">
                <a href="ProductPage.html" class="logo">
                    <img class="logo"src="StepBrewLogo1.png" alt="Step Brew">
                </a>
            </div>
            <div class="navbar">
                <nav class="header">
                    <a href="ProductPage.html">HOME</a>
                    <a href="Menu.html">MENU</a>
                    <a href="About.html">ABOUT</a>
                    <a href="review.html">REVIEWS</a>  
                </nav>
            </div>
            <div class="icons">
                <div class="searchbar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="bag_icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="quantity">0</span>
                </div>   
            </div>
        </div>
        <div class="sidebar">
            <div class="Search">
                <input placeholder="Search..." id="searchBar" name="searchBar" type="text">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="categories"><!--hr-->
                <div class="categoryhead">
                    <h2>Tags</h2>
                    <button onclick="resetFilter()">Clear Filter</button>
                </div><!--hr><br-->
                <div class="catlist">
                    <button onclick="filterByCategory('Hot Drinks')">Hot Drinks</button><br>
                    <button onclick="filterByCategory('Cold Drinks')">Cold Drinks</button><br>
                    <button onclick="filterByCategory('Desserts')">Desserts</button>
                </div>
            </div>
        </div>    
        <div class="menu_items"></div>
            <div class="cc-btn">
                <h1>Your Bag</h1>
                <ul class="itemList"></ul>
                <div>

                </div>
                <div class="totalpricey">
                    <div class="total-price">Total Price:
                    </div>
                    <div class="totalamount">₱
                        <span class="checkout-price">0.00</span>
                    </div>
                </div>
                
                <div class="checkOut">
                    <div class="checkout">Place Order</div>
                    <div class="close">CLOSE</div>
                </div>
                  
            </div>
        </div>
    </div>
    <script src="menu.js"></script> 
</body>
</html>
